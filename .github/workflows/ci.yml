name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# matrix-task-queue-bot has no test suite and is not packaged (no [build-system]),
# so CI is lint-only for now. Test coverage + packaging are tracked in Vikunja.
jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.16.0

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .
